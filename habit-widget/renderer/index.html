<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reel Habit</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="widget" id="widget">

    <header class="chrome" id="chrome">
      <div class="drag-zone"></div>
      <div class="chrome-actions">
        <button class="icon-btn" id="theme-btn" type="button" title="Toggle day / night" aria-label="Toggle day or night mode"></button>
        <button class="icon-btn" id="pin-btn" type="button" title="Keep on top" aria-label="Keep widget on top" aria-pressed="false">
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M9.6 1.4a1 1 0 0 0-1.5.1L6 4.3 2.9 5.4a1 1 0 0 0-.4 1.7l2.2 2.2-3 3.9a.5.5 0 0 0 .7.7l3.9-3 2.2 2.2a1 1 0 0 0 1.7-.4L11.7 10l2.8-2.1a1 1 0 0 0 .1-1.5z"/></svg>
        </button>
        <button class="icon-btn" id="more-btn" type="button" title="More" aria-label="More options" aria-haspopup="true" aria-expanded="false">
          <svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="3" cy="8" r="1.4"/><circle cx="8" cy="8" r="1.4"/><circle cx="13" cy="8" r="1.4"/></svg>
        </button>
      </div>
    </header>

    <h1 class="month-title" id="month-title">AUGUST</h1>

    <div class="subhead">
      <div class="habit-line">
        <span class="habit-dot" aria-hidden="true"></span>
        <span
          class="habit-name"
          id="habit-name"
          contenteditable="true"
          spellcheck="false"
          role="textbox"
          aria-label="Habit name">Post Reel</span>
      </div>
      <div class="nav">
        <button class="nav-btn" id="prev-btn" type="button" title="Previous month" aria-label="Previous month">
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M10 2.5 4.5 8l5.5 5.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <button class="nav-btn today-btn" id="today-btn" type="button" title="Jump to this month">Today</button>
        <button class="nav-btn" id="next-btn" type="button" title="Next month" aria-label="Next month">
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M6 2.5 11.5 8 6 13.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </div>
    </div>

    <div class="weekdays" id="weekdays" aria-hidden="true"></div>

    <div class="grid" id="grid" role="grid" aria-label="Habit calendar"></div>

    <footer class="stats" id="stats"></footer>

    <div class="resize-grip" id="resize-grip" title="Drag to resize" aria-hidden="true">
      <svg viewBox="0 0 12 12"><path d="M11 4 4 11M11 8l-3 3" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
    </div>
  </div>

  <!-- Status picker, positioned next to whichever tile was clicked. -->
  <div class="menu" id="status-menu" role="menu" hidden></div>

  <!-- Overflow menu for the ⋯ button. -->
  <div class="menu" id="more-menu" role="menu" hidden></div>

  <script src="app.js"></script>
</body>
</html>
