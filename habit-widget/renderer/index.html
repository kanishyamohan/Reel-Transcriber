<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reel Habit</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="widget" id="widget">
    <!-- Painted background sits behind everything so its opacity can be
         dialled down without fading the text on top of it. -->
    <div class="widget-bg" id="widget-bg" aria-hidden="true"></div>

    <div class="widget-inner">
      <header class="chrome" id="chrome">
        <div class="drag-zone"></div>
        <div class="chrome-actions">
          <button class="icon-btn" id="theme-btn" type="button" title="Toggle day / night" aria-label="Toggle day or night mode"></button>
          <button class="icon-btn" id="settings-btn" type="button" title="Customise" aria-label="Customise appearance and statuses">
            <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 5.4A2.6 2.6 0 1 0 8 10.6 2.6 2.6 0 0 0 8 5.4zm6 3.3V7.3l-1.7-.3a4.6 4.6 0 0 0-.5-1.2l1-1.4-1-1-1.4 1a4.6 4.6 0 0 0-1.2-.5L8.7 2H7.3l-.3 1.7a4.6 4.6 0 0 0-1.2.5l-1.4-1-1 1 1 1.4a4.6 4.6 0 0 0-.5 1.2L2 7.3v1.4l1.7.3c.1.4.3.8.5 1.2l-1 1.4 1 1 1.4-1c.4.2.8.4 1.2.5l.3 1.7h1.4l.3-1.7c.4-.1.8-.3 1.2-.5l1.4 1 1-1-1-1.4c.2-.4.4-.8.5-1.2z"/></svg>
          </button>
          <button class="icon-btn" id="pin-btn" type="button" title="Keep on top" aria-label="Keep widget on top" aria-pressed="false">
            <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M9.6 1.4a1 1 0 0 0-1.5.1L6 4.3 2.9 5.4a1 1 0 0 0-.4 1.7l2.2 2.2-3 3.9a.5.5 0 0 0 .7.7l3.9-3 2.2 2.2a1 1 0 0 0 1.7-.4L11.7 10l2.8-2.1a1 1 0 0 0 .1-1.5z"/></svg>
          </button>
          <button class="icon-btn" id="more-btn" type="button" title="More" aria-label="More options" aria-haspopup="true" aria-expanded="false">
            <svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="3" cy="8" r="1.4"/><circle cx="8" cy="8" r="1.4"/><circle cx="13" cy="8" r="1.4"/></svg>
          </button>
        </div>
      </header>

      <h1 class="month-title" id="month-title">AUGUST</h1>

      <div class="subhead">
        <div class="habit-line">
          <span class="habit-dot" id="habit-dot" aria-hidden="true"></span>
          <span
            class="habit-name"
            id="habit-name"
            contenteditable="true"
            spellcheck="false"
            role="textbox"
            aria-label="Habit name">Post Reel</span>
        </div>
        <div class="nav">
          <button class="nav-btn" id="prev-btn" type="button" title="Previous month" aria-label="Previous month">
            <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M10 2.5 4.5 8l5.5 5.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
          <button class="nav-btn today-btn" id="today-btn" type="button" title="Jump to this month">Today</button>
          <button class="nav-btn" id="next-btn" type="button" title="Next month" aria-label="Next month">
            <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M6 2.5 11.5 8 6 13.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
        </div>
      </div>

      <div class="weekdays" id="weekdays" aria-hidden="true"></div>

      <div class="grid" id="grid" role="grid" aria-label="Habit calendar"></div>

      <footer class="stats" id="stats"></footer>
    </div>

    <!-- Customisation panel. Slides over the calendar; contents built in JS. -->
    <section class="sheet" id="sheet" hidden aria-label="Customise" role="dialog" aria-modal="true">
      <header class="sheet-head">
        <div class="tabs" role="tablist">
          <button class="tab" id="tab-look" type="button" role="tab" aria-selected="true">Look</button>
          <button class="tab" id="tab-statuses" type="button" role="tab" aria-selected="false">Options</button>
        </div>
        <button class="icon-btn" id="sheet-close" type="button" title="Done" aria-label="Close customise panel">
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4 4l8 8M12 4l-8 8" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
        </button>
      </header>
      <div class="sheet-body" id="sheet-body"></div>
    </section>

    <div class="resize-grip" id="resize-grip" title="Drag to resize" aria-hidden="true">
      <svg viewBox="0 0 12 12"><path d="M11 4 4 11M11 8l-3 3" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
    </div>
  </div>

  <div class="menu" id="status-menu" role="menu" hidden></div>
  <div class="menu" id="more-menu" role="menu" hidden></div>
  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

  <script src="store.js"></script>
  <script src="appearance.js"></script>
  <script src="app.js"></script>
  <script src="settings.js"></script>
</body>
</html>
