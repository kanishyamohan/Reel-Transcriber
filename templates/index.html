<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reel Transcriber</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
</head>
<body>
  <main class="card">
    <header>
      <h1>🎬 Reel Transcriber</h1>
      <p class="subtitle">Paste an Instagram reel link and get a written transcript.</p>
    </header>

    <!-- Step 1: input -->
    <section id="input-step">
      <div class="input-row">
        <input
          id="url-input"
          type="url"
          placeholder="https://www.instagram.com/reel/..."
          autocomplete="off"
          spellcheck="false"
        />
        <button id="transcribe-btn">Transcribe</button>
      </div>
      <div class="lang-row">
        <label for="lang-select">Translate to</label>
        <select id="lang-select">
          {% for value, label in languages.items() %}
          <option value="{{ value }}">{{ label }}</option>
          {% endfor %}
        </select>
      </div>
      <p id="error-msg" class="error hidden"></p>
    </section>

    <!-- Loading -->
    <section id="loading-step" class="hidden">
      <div class="spinner"></div>
      <p>Fetching reel and transcribing… this can take a moment.</p>
    </section>

    <!-- Step 2: result -->
    <section id="result-step" class="hidden">
      <img id="thumbnail" class="thumbnail hidden" alt="Reel thumbnail" />
      <h2 id="result-title" class="result-title"></h2>

      <div class="block">
        <h3>Transcript</h3>
        <textarea id="transcript" readonly></textarea>
        <button class="copy-btn" data-target="transcript">📋 Copy transcript</button>
      </div>

      <div id="translation-block" class="block hidden">
        <h3 id="translation-heading">Translation</h3>
        <textarea id="translation" readonly></textarea>
        <button class="copy-btn" data-target="translation">📋 Copy translation</button>
      </div>

      <p id="note-msg" class="note hidden"></p>

      <div class="actions">
        <button id="restart-btn" class="secondary">🔄 Start over</button>
      </div>
    </section>
  </main>

  <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
